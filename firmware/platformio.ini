; Balloone — firmware da ESP32-CAM
; Documentação: https://docs.platformio.org/page/projectconf.html
;
; A placa ainda precisa ser confirmada com a Titans. A foto do edital mostra
; uma ESP32-WROVER-DEV (estilo Freenove).
;
; Ambientes:
;   wrover-cam / aithinker-cam  → o robô de verdade
;   devkit                      → ESP32 comum, sem câmera (LEDs no lugar dos motores)
;   wokwi                       → simulador Wokwi (sem câmera)
;   native                      → testes no computador, sem placa nenhuma:
;                                 pio test -e native

[platformio]
default_envs = wrover-cam

; Configuração comum a todas as placas ESP32
[esp32]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Bibliotecas da placa. A Rede acrescenta aqui o servidor WebSocket (D-002).
lib_deps =
    bblanchon/ArduinoJson @ ^7
; Os testes rodam no ambiente native, não na placa.
test_ignore = *

[env:wrover-cam]
; ESP32-WROVER-DEV / Freenove ESP32-WROVER CAM (USB próprio, 4 MB PSRAM)
extends = esp32
board = esp-wrover-kit
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DPLACA_WROVER_CAM

[env:aithinker-cam]
; ESP32-CAM AI-Thinker (precisa de programador FTDI ou base ESP32-CAM-MB)
extends = esp32
board = esp32cam
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DPLACA_AITHINKER_CAM

[env:devkit]
; ESP32 comum (DevKit), sem câmera: LEDs nos pinos dos motores fazem o papel
; das rodas. Cria a rede BALLOONE-G4 de verdade, como o robô.
extends = esp32
board = esp32dev
build_flags =
    -DSEM_CAMERA
    -DPLACA_DEVKIT

[env:wokwi]
; Simulador Wokwi. Igual ao devkit, mas o robô entra na rede Wokwi-GUEST em
; vez de criar a própria (o Wokwi não simula o modo AP). Veja wokwi.toml.
extends = env:devkit
build_flags =
    ${env:devkit.build_flags}
    -DSIMULACAO

[env:native]
; Testes no computador (pasta test/). Precisa de um compilador gcc instalado.
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson @ ^7
build_flags =
    -std=gnu++17
