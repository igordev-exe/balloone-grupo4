; Balloone — firmware da ESP32-CAM
; Documentação: https://docs.platformio.org/page/projectconf.html
;
; A placa ainda precisa ser confirmada com a Titans. A foto do edital mostra
; uma ESP32-WROVER-DEV (estilo Freenove).

[platformio]
default_envs = wrover-cam

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Bibliotecas entram aqui depois da decisão de arquitetura (ex.: WebSocket).
lib_deps =

[env:wrover-cam]
; ESP32-WROVER-DEV / Freenove ESP32-WROVER CAM (USB próprio, 4 MB PSRAM)
board = esp-wrover-kit
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DPLACA_WROVER_CAM

[env:aithinker-cam]
; ESP32-CAM AI-Thinker (precisa de programador FTDI ou base ESP32-CAM-MB)
board = esp32cam
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DPLACA_AITHINKER_CAM
