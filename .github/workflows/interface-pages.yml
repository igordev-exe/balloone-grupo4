# Publica a interface (modo simulador) no GitHub Pages a cada push na main.
# Ative antes: Settings → Pages → Build and deployment → Source: GitHub Actions.
# O robô real NÃO funciona pelo Pages (HTTPS não fala com o HTTP do robô):
# para pilotar, rode a interface no notebook (pnpm dev).
name: Interface no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["interface/**", ".github/workflows/interface-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: interface/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # O Pages serve em /<nome-do-repo>/: o vite.config usa BASE_PATH como base.
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: interface/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
